name: mac-check

# The macOS proof run: Rust lint and tests on macOS, the universal app and its dmg, the real app
# launched against made-up Claude data (pictures of every page from the system's screencapture),
# the same pages in WebKit through the browser preview, and atlas-usage on the made-up data.
# Pictures and logs are uploaded as the "mac-check" artifact. Re-run any time from the Actions tab;
# the same checks run on any Mac with tools/mac-check.sh (see its header).
#
# Lean on purpose (macOS minutes count 10x): one job, cargo cache, no matrix. Release builds here
# use thin codegen settings to build faster; the shipped profile is release.yml's.

on:
  workflow_dispatch:
    inputs:
      intro_only:
        description: "Only the launch intro check: a native release app opened three times while the screen is recorded (tools/mac-intro.sh)"
        type: boolean
        default: false
  push:
    branches: [main, mac-check]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: mac-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Faster release builds for the check (behaviour is the same; the release workflow keeps lto).
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  mac:
    name: macOS check
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (the toolchain itself is pinned by the input below)
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: mac-check

      - name: Install frontend dependencies
        run: npm ci

      # The Claude Code connector (atlas-mcp) rides inside the app: tauri.macos-bundle.conf.json
      # bundles this universal binary as a resource (Contents/Resources/atlas-mcp).
      - name: Build atlas-mcp (universal)
        if: ${{ inputs.intro_only != true }}
        run: |
          cargo build -p atlas-mcp --release --target aarch64-apple-darwin --target x86_64-apple-darwin
          lipo -create -output target/atlas-mcp-universal target/aarch64-apple-darwin/release/atlas-mcp target/x86_64-apple-darwin/release/atlas-mcp

      # The browser-preview copy of the frontend, with the screenshot tour built in
      # (VITE_ATLAS_TOUR=1; vite.config.ts). Its own folder: `tauri build` rebuilds dist/ itself.
      - name: Build the frontend with the tour (browser preview)
        if: ${{ inputs.intro_only != true }}
        env:
          VITE_ATLAS_TOUR: "1"
        run: npx vite build --outDir dist-tour

      # The tour app: a debug build (the only kind with the screenshot tour in it). Its frontend
      # (tauri's beforeBuildCommand) is built with the tour in too.
      - name: Build the tour app (debug)
        id: debug
        if: ${{ inputs.intro_only != true }}
        env:
          VITE_ATLAS_TOUR: "1"
        run: npx tauri build --debug --bundles app --config crates/app/tauri.macos-bundle.conf.json --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # The app as it ships: universal, ad-hoc signed, with the dmg, and its frontend built without
      # the tour. The real update-signing key lives only in release.yml: this proof signs the update
      # bundle with a throwaway key made here, to show the .sig still gets made.
      - name: Build the universal app and dmg
        id: universal
        if: ${{ !cancelled() && inputs.intro_only != true }}
        env:
          # GitHub sets CI=true, and Tauri then skips the Finder step that lays the icons out on
          # the dmg background (no .DS_Store). The runner allows Finder scripting, so keep it.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: |
          key="$RUNNER_TEMP/throwaway-update.key"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$(openssl rand -hex 24)
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          npx tauri signer generate --ci -f -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" -w "$key" >/dev/null
          TAURI_SIGNING_PRIVATE_KEY=$(cat "$key")
          export TAURI_SIGNING_PRIVATE_KEY
          rm -f "$key" "$key.pub"
          echo "ATLAS_EXPECT_UPDATER=1" >> "$GITHUB_ENV"
          npx tauri build --target universal-apple-darwin --bundles app,dmg --config crates/app/tauri.macos-bundle.conf.json

      - name: Build atlas-usage (universal)
        if: ${{ !cancelled() && inputs.intro_only != true }}
        run: |
          cargo build -p atlas-cli --release --target aarch64-apple-darwin --target x86_64-apple-darwin
          lipo -create -output target/atlas-usage-universal target/aarch64-apple-darwin/release/atlas-usage target/x86_64-apple-darwin/release/atlas-usage

      - name: Install WebKit for Playwright
        id: playwright
        if: ${{ !cancelled() && inputs.intro_only != true }}
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.64.1
          npx playwright install webkit

      - name: WebKit pictures of every page (browser preview, mock data)
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' && inputs.intro_only != true }}
        env:
          ATLAS_DIST: dist-tour
        run: node tools/webkit-shots.mjs mac-check-out/webkit

      - name: Real app checks and pictures
        if: ${{ !cancelled() && steps.universal.outcome == 'success' && inputs.intro_only != true }}
        run: bash tools/mac-check.sh mac-check-out

      # Lint and tests last, so a lint slip never costs the pictures.
      - name: cargo clippy (macOS)
        if: ${{ !cancelled() && inputs.intro_only != true }}
        run: cargo clippy --workspace --exclude atlas-setup --all-targets -- -D warnings

      - name: cargo test (macOS)
        if: ${{ !cancelled() && inputs.intro_only != true }}
        run: cargo test --workspace --exclude atlas-setup

      # The launch intro, recorded (workflow_dispatch with intro_only). A native release build
      # (no universal, no dmg) is enough: the intro is the same code on both architectures.
      - name: Build the app for the intro check
        id: intro_app
        if: ${{ inputs.intro_only == true }}
        run: npx tauri build --target aarch64-apple-darwin --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Launch intro recordings
        if: ${{ !cancelled() && steps.intro_app.outcome == 'success' }}
        run: bash tools/mac-intro.sh mac-check-out

      - name: Summary
        if: always()
        run: |
          for f in mac-check-out/summary.txt mac-check-out/intro/intro-summary.txt; do [ -f "$f" ] && { echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; done; true

      - name: Upload pictures and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-check
          if-no-files-found: warn
          retention-days: 14
          path: |
            mac-check-out/
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
