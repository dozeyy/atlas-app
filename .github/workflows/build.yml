name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            tauri_args: ""
            rust_targets: ""
          - name: macOS (universal)
            os: macos-latest
            tauri_args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      # 1. Build the installers (this also builds the frontend).
      - name: Build installers
        run: npx tauri build ${{ matrix.tauri_args }}

      # 2. Rust tests: core (unit + fixtures + sandbox) and the app crate.
      - name: cargo test
        run: cargo test --workspace

      # 3. Frontend tests.
      - name: Frontend tests
        run: npm test

      # 4. Installers as artifacts.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
