name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            tauri_args: ""
            rust_targets: ""
          - name: macOS (universal)
            os: macos-latest
            tauri_args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (the toolchain itself is pinned by the input below)
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install frontend dependencies
        run: npm ci

      # The Claude Code connector (atlas-mcp) rides inside the app: tauri.macos-bundle.conf.json
      # bundles this universal binary as a resource (Contents/Resources/atlas-mcp).
      - name: Build atlas-mcp (universal)
        if: runner.os == 'macOS'
        run: |
          cargo build -p atlas-mcp --release --target aarch64-apple-darwin --target x86_64-apple-darwin
          lipo -create -output target/atlas-mcp-universal target/aarch64-apple-darwin/release/atlas-mcp target/x86_64-apple-darwin/release/atlas-mcp

      # 1. Build the installers (this also builds the frontend). Windows: atlas-usage, the NSIS
      #    installer with it inside, and Atlas Setup with that installer inside (the same script the
      #    release uses). There is no update signing key here, so no update bundles are made.
      - name: Build installers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/build-setup.ps1 -OutDir dist-setup
      - name: Build installers (macOS)
        if: runner.os == 'macOS'
        run: npx tauri build ${{ matrix.tauri_args }} --config crates/app/tauri.macos-bundle.conf.json --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # 2. Rust tests: core (unit + fixtures + sandbox) and the app crate. Atlas Setup is Windows-only.
      - name: cargo test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cargo test --workspace --exclude atlas-setup
          else
            cargo test --workspace
          fi

      # 3. Frontend tests.
      - name: Frontend tests
        run: npm test

      # 4. Installers as artifacts.
      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Upload Atlas Setup
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-setup-Windows
          if-no-files-found: error
          path: dist-setup/Atlas-Setup-Windows-x64.exe

      # 5. The atlas-usage CLI behind the Claude Code skill (skill/README.md).
      - name: Build atlas-usage
        shell: bash
        run: |
          mkdir -p dist-cli
          if [ "$RUNNER_OS" = "macOS" ]; then
            cargo build -p atlas-cli --release --target aarch64-apple-darwin --target x86_64-apple-darwin
            lipo -create -output dist-cli/atlas-usage target/aarch64-apple-darwin/release/atlas-usage target/x86_64-apple-darwin/release/atlas-usage
          else
            cargo build -p atlas-cli --release
            cp target/release/atlas-usage.exe dist-cli/
          fi

      - name: Upload atlas-usage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-usage-${{ runner.os }}
          if-no-files-found: error
          path: dist-cli/*