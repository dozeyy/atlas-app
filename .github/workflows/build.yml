name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            tauri_args: ""
            rust_targets: ""
          - name: macOS (universal)
            os: macos-latest
            tauri_args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (the toolchain itself is pinned by the input below)
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install frontend dependencies
        run: npm ci

      # 1. Build the installers (this also builds the frontend).
      - name: Build installers
        run: npx tauri build ${{ matrix.tauri_args }}

      # 2. Rust tests: core (unit + fixtures + sandbox) and the app crate.
      - name: cargo test
        run: cargo test --workspace

      # 3. Frontend tests.
      - name: Frontend tests
        run: npm test

      # 4. Installers as artifacts.
      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
