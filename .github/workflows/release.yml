name: release

# A tag `vX.Y.Z` builds every download and publishes the GitHub Release. Every build job uses a
# throwaway signing key made on the runner and sees no secret at all, so a branch with an edited
# workflow has nothing to read. Only the `publish` job (official release only: see the `gate`
# job) runs in the `release` environment, re-signs the two update bundles with the real key and
# makes the Release. A manual run, or a tag not on main's history, publishes nothing.
#
# This repository (dozeyy/atlas-app) is private and holds the source. The workflow makes the
# finished release here as a PRERELEASE (the staging copy: the installers, latest.json, the
# atlas-usage binaries and SHA256SUMS.txt) with the default job token, and pins the skill
# checksums on main. It never writes to any other repository and holds no cross-repo secret.
# The public repository dozeyy/atlas gets the release from Will's own PC afterwards:
# `tools/publish-public.ps1 -Version X.Y.Z` (docs/releasing.md). latest.json already carries the
# final dozeyy/atlas URLs, so it works unchanged once the files are copied there.
#
# Secrets live in the `release` environment, not in the repository (set once, see
# docs/releasing.md; the environment only accepts `v*` tags):
#   TAURI_SIGNING_PRIVATE_KEY           the in-app update signing key (content of atlas-updater.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty: the key has none)
#
# Release assets (stable names, linked from the public README and the skill):
#   Atlas-Setup-Windows-x64.exe  Atlas-macOS.dmg  atlas-usage-windows-x64.exe
#   atlas-usage-macos-universal  atlas-usage-linux-x64  SHA256SUMS.txt  latest.json
# plus the update bundles and their .sig files under the names Tauri gives them. The MSI is not
# published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  versions:
    name: Versions agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: v
        shell: bash
        run: |
          app=$(jq -r .version crates/app/tauri.conf.json)
          plugin=$(jq -r .version skill/.claude-plugin/plugin.json)
          echo "tauri.conf.json: $app"
          echo "plugin.json:     $plugin"
          if [ "$app" != "$plugin" ]; then
            echo "::error::crates/app/tauri.conf.json ($app) and skill/.claude-plugin/plugin.json ($plugin) disagree."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "tag:             $tag"
            if [ "$tag" != "$app" ]; then
              echo "::error::The tag says $tag but the files say $app. Fix the versions, then tag again."
              exit 1
            fi
          fi
          echo "version=$app" >> "$GITHUB_OUTPUT"

  # The one place that decides whether this run is a real release: a `v*` tag push whose commit is
  # part of main's history. Only then do the build jobs receive the update-signing key and does
  # the publish job run. A manual run, or a tag cut from any other branch, still builds (with a
  # throwaway signing key made on the runner) so the files can be checked, and publishes nothing.
  gate:
    name: Official release?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      official: ${{ steps.g.outputs.official }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: g
        shell: bash
        run: |
          set -euo pipefail
          official=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            git fetch --no-tags origin main
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              official=true
            else
              echo "::warning::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main's history: building with a throwaway key, publishing nothing."
            fi
          else
            echo "Not a tag push: building with a throwaway key, publishing nothing."
          fi
          echo "official=$official" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows
    needs: [versions, gate]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (the toolchain itself is pinned by the input below)
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install frontend dependencies
        run: npm ci

      # atlas-usage.exe, then the signed installer with it inside, then Atlas Setup with that
      # installer inside. tools/build-setup.ps1 is the same chain anyone runs locally.
      - name: Build installer and Atlas Setup
        shell: pwsh
        # No secret here. Tauri wants some key to build the update bundle; this one lives for
        # this run only. The `publish` job signs the real bundles.
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'throwaway-update.key'
          $pw = (New-Guid).ToString('N') + (New-Guid).ToString('N')
          npx tauri signer generate --ci -f -p $pw -w $key | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'could not make the throwaway key' }
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $pw
          $env:TAURI_SIGNING_PRIVATE_KEY = Get-Content $key -Raw
          Remove-Item $key, "$key.pub" -Force
          ./tools/build-setup.ps1 -OutDir out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect files
        shell: bash
        # Through the environment, never pasted into the script text.
        env:
          VERSION: ${{ needs.versions.outputs.version }}
        run: |
          set -euo pipefail
          v="$VERSION"
          nsis="target/release/bundle/nsis/Atlas_${v}_x64-setup.exe"
          for f in "$nsis" "$nsis.sig" out/Atlas-Setup-Windows-x64.exe target/release/atlas-usage.exe; do
            [ -f "$f" ] || { echo "::error::Missing $f. A release without it would break updates or downloads."; exit 1; }
          done
          cp "$nsis" "$nsis.sig" out/
          cp target/release/atlas-usage.exe out/atlas-usage-windows-x64.exe
          rm -f out/atlas-usage.exe
          ls -l out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: files-windows
          if-no-files-found: error
          path: out/*

  macos:
    name: macOS (universal)
    needs: [versions, gate]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (the toolchain itself is pinned by the input below)
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install frontend dependencies
        run: npm ci

      # The Claude Code connector (atlas-mcp) rides inside the app: tauri.macos-bundle.conf.json
      # bundles this universal binary as a resource (Contents/Resources/atlas-mcp).
      - name: Build atlas-mcp (universal)
        run: |
          cargo build -p atlas-mcp --release --target aarch64-apple-darwin --target x86_64-apple-darwin
          lipo -create -output target/atlas-mcp-universal target/aarch64-apple-darwin/release/atlas-mcp target/x86_64-apple-darwin/release/atlas-mcp

      - name: Build app, dmg and update bundle
        env:
          # GitHub sets CI=true, and Tauri then skips the Finder step that lays the icons out on
          # the dmg background (no .DS_Store). The runner allows Finder scripting, so keep it.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        # No secret here. A throwaway key for this run only; the `publish` job signs the real bundle.
        run: |
          key="$RUNNER_TEMP/throwaway-update.key"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$(openssl rand -hex 24)
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          npx tauri signer generate --ci -f -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" -w "$key" >/dev/null
          TAURI_SIGNING_PRIVATE_KEY=$(cat "$key")
          export TAURI_SIGNING_PRIVATE_KEY
          rm -f "$key" "$key.pub"
          npx tauri build --target universal-apple-darwin --config crates/app/tauri.macos-bundle.conf.json

      - name: Build atlas-usage
        run: |
          cargo build -p atlas-cli --release --target aarch64-apple-darwin --target x86_64-apple-darwin
          lipo -create -output atlas-usage-macos-universal target/aarch64-apple-darwin/release/atlas-usage target/x86_64-apple-darwin/release/atlas-usage

      - name: Collect files
        run: |
          set -euo pipefail
          b=target/universal-apple-darwin/release/bundle
          mkdir out
          dmg=$(ls "$b"/dmg/*.dmg | head -n 1)
          for f in "$dmg" "$b/macos/Atlas.app.tar.gz" "$b/macos/Atlas.app.tar.gz.sig" atlas-usage-macos-universal; do
            [ -f "$f" ] || { echo "::error::Missing $f. A release without it would break updates or downloads."; exit 1; }
          done
          cp "$dmg" out/Atlas-macOS.dmg
          cp "$b/macos/Atlas.app.tar.gz" "$b/macos/Atlas.app.tar.gz.sig" atlas-usage-macos-universal out/
          ls -l out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: files-macos
          if-no-files-found: error
          path: out/*

  linux-cli:
    name: atlas-usage (Linux)
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (the toolchain itself is pinned by the input below)
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo build -p atlas-cli --release

      - run: |
          mkdir out
          cp target/release/atlas-usage out/atlas-usage-linux-x64
          ls -l out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: files-linux
          if-no-files-found: error
          path: out/*

  publish:
    name: Publish
    needs: [versions, gate, windows, macos, linux-cli]
    # Only a v* tag whose commit is on main's history (decided once, in the gate job).
    if: needs.gate.outputs.official == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only job that holds the real signing key. The key is a secret of the `release`
    # environment, which only accepts `v*` tags (docs/releasing.md has the commands that make it).
    environment: release
    # The only job that writes, and only to this repository: the staging prerelease and the pinned
    # skill checksums on main (the job token).
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Where the finished release is published later (tools/publish-public.ps1). Only used to
      # write the download URLs into latest.json.
      PUBLIC_REPO: dozeyy/atlas
      VERSION: ${{ needs.versions.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install the Tauri signer
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: files-*
          merge-multiple: true
          path: dist

      - name: Check every file is there
        shell: bash
        run: |
          set -euo pipefail
          for f in Atlas-Setup-Windows-x64.exe "Atlas_${VERSION}_x64-setup.exe" "Atlas_${VERSION}_x64-setup.exe.sig" \
                   Atlas-macOS.dmg Atlas.app.tar.gz Atlas.app.tar.gz.sig \
                   atlas-usage-windows-x64.exe atlas-usage-macos-universal atlas-usage-linux-x64; do
            [ -s "dist/$f" ] || { echo "::error::dist/$f is missing or empty."; exit 1; }
          done
          ls -l dist

      # The build jobs signed with a key that no longer exists. These two files are what the in-app
      # updater checks against the public key in tauri.conf.json: sign them with the real one.
      - name: Sign the update bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::The release environment has no TAURI_SIGNING_PRIVATE_KEY secret."; exit 1; }
          for f in "dist/Atlas_${VERSION}_x64-setup.exe" dist/Atlas.app.tar.gz; do
            rm -f "$f.sig"
            # -p given explicitly: an empty password is a real value, not a missing one.
            npx tauri signer sign -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$f" >/dev/null
            [ -s "$f.sig" ] || { echo "::error::$f.sig was not written."; exit 1; }
          done
          ls -l dist

      # What the in-app updater reads: the version, the notes and, per platform, the signed bundle.
      - name: Write latest.json
        shell: bash
        run: |
          set -euo pipefail
          # The files are published at the public repo's release of the same tag (a later, manual step).
          base="https://github.com/${PUBLIC_REPO}/releases/download/${TAG}"
          # Notes belong to one version: docs/release-notes/<version>.md. A release without a file
          # of its own reads "Atlas <version>"; an older release's notes are never reused.
          notes="Atlas ${VERSION}"
          notes_file="docs/release-notes/${VERSION}.md"
          if [ -s "$notes_file" ]; then notes="$(cat "$notes_file")"; fi
          jq -n \
            --arg v "$VERSION" \
            --arg notes "$notes" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg win_url "$base/Atlas_${VERSION}_x64-setup.exe" \
            --arg win_sig "$(cat "dist/Atlas_${VERSION}_x64-setup.exe.sig")" \
            --arg mac_url "$base/Atlas.app.tar.gz" \
            --arg mac_sig "$(cat dist/Atlas.app.tar.gz.sig)" \
            '{
               version: $v, notes: $notes, pub_date: $date,
               platforms: {
                 "windows-x86_64":   { signature: $win_sig, url: $win_url },
                 "darwin-universal": { signature: $mac_sig, url: $mac_url },
                 "darwin-aarch64":   { signature: $mac_sig, url: $mac_url },
                 "darwin-x86_64":    { signature: $mac_sig, url: $mac_url }
               }
             }' > dist/latest.json
          jq . dist/latest.json

      # One list covering every asset in the Release.
      - name: Write SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum $(ls | grep -v '^SHA256SUMS.txt$' | sort) > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The staging copy, in this private repo: a prerelease (never "latest"), so nothing public
      # points at it. tools/publish-public.ps1 downloads it, verifies it and copies it to the public
      # repo. Notes: this version's file, else one line.
      - name: Create the staging release (private repo)
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          if [ -s "docs/release-notes/${VERSION}.md" ]; then
            cp "docs/release-notes/${VERSION}.md" "$notes"
          else
            echo "Atlas ${VERSION}" > "$notes"
          fi
          gh release create "$TAG" dist/* --verify-tag --prerelease --title "Atlas ${VERSION} (staging)" --notes-file "$notes"

      # The skill downloads atlas-usage and checks it against skill/skills/atlas/bin/checksums.txt;
      # pin the three binaries of THIS release there. This step writes to main, so it only does so
      # when that is safe, and otherwise says why it did not (the release itself already stands):
      #  - the tag's commit must be part of main's history (a tag cut from a branch never pins);
      #  - the pin script runs as it is on main, not as the tag carries it;
      #  - main must still be on this version, and no newer version may be pinned already.
      # publish-public.ps1 reads the pins from main and refuses a version that is not pinned there.
      - name: Pin skill checksums
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --unshallow origin
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::warning::Tag $TAG ($GITHUB_SHA) is not on main's history, so the skill checksums were not pinned."
            exit 0
          fi
          # From here on every file is main's, the pin script included.
          git switch -C main origin/main
          plugin="$(jq -r .version skill/.claude-plugin/plugin.json)"
          if [ "$plugin" != "$VERSION" ]; then
            echo "::warning::main is at plugin version $plugin, not $VERSION, so the skill checksums of $VERSION were not pinned."
            exit 0
          fi
          sums=skill/skills/atlas/bin/checksums.txt
          pinned="$(awk '!/^[[:space:]]*#/ && NF >= 3 { print $1 }' "$sums" | sort -V | tail -n 1)"
          if [ -n "$pinned" ] && [ "$(printf '%s\n%s\n' "$pinned" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "::warning::$pinned is already pinned, which is newer than $VERSION, so nothing was pinned."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/pin"
          cp dist/atlas-usage-windows-x64.exe dist/atlas-usage-macos-universal dist/atlas-usage-linux-x64 "$RUNNER_TEMP/pin/"
          # Never -Force: a version that is pinned with other hashes stops here, loudly.
          pwsh tools/pin-skill-checksums.ps1 -Dir "$RUNNER_TEMP/pin" -Version "$VERSION"
          git add "$sums"
          if git diff --cached --quiet; then
            echo "checksums.txt already matches v${VERSION}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pin skill checksums for v${VERSION}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch --no-tags origin main
            git rebase origin/main
          done
          echo "::error::Could not push the pinned checksums to main."
          exit 1
