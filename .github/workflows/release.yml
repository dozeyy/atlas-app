name: release

# A tag `vX.Y.Z` builds every download and publishes the GitHub Release. Every build job uses a
# throwaway signing key made on the runner and sees no secret at all, so a branch with an edited
# workflow has nothing to read. Only the `publish` job (official release only: see the `gate`
# job) runs in the `release` environment, re-signs the two update bundles with the real key and
# makes the Release. A manual run, or a tag not on main's history, publishes nothing.
#
# This repository (dozeyy/atlas-app) is private and holds the source. The workflow makes the
# finished release here as a PRERELEASE (the staging copy: the installers, latest.json, the
# atlas-usage binaries and the signed SHA256SUMS.txt) with the default job token, and pins the skill
# checksums on main. It never writes to any other repository and holds no cross-repo secret.
# The public repository dozeyy/atlas gets the release from Will's own PC afterwards:
# `tools/publish-public.ps1 -Version X.Y.Z` (docs/releasing.md). latest.json already carries the
# final dozeyy/atlas URLs, so it works unchanged once the files are copied there.
#
# Secrets live in the `release` environment, not in the repository (set once, see
# docs/releasing.md; the environment only accepts `v*` tags):
#   TAURI_SIGNING_PRIVATE_KEY           the in-app update signing key (content of atlas-updater.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty: the key has none)
#
# Release assets (stable names, linked from the public README and the skill):
#   Atlas-Setup-Windows-x64.exe  Atlas-macOS.dmg  atlas-usage-windows-x64.exe
#   atlas-usage-macos-universal  atlas-usage-linux-x64  atlas-usage-linux-arm64
#   atlas-usage-linux-x64-musl  atlas-usage-windows-arm64.exe
#   SHA256SUMS.txt  SHA256SUMS.txt.sig  latest.json
# plus the update bundles and their .sig files under the names Tauri gives them. The MSI is not
# published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  versions:
    name: Versions agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: v
        shell: bash
        run: |
          app=$(jq -r .version crates/app/tauri.conf.json)
          plugin=$(jq -r .version skill/.claude-plugin/plugin.json)
          echo "tauri.conf.json: $app"
          echo "plugin.json:     $plugin"
          if [ "$app" != "$plugin" ]; then
            echo "::error::crates/app/tauri.conf.json ($app) and skill/.claude-plugin/plugin.json ($plugin) disagree."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "tag:             $tag"
            if [ "$tag" != "$app" ]; then
              echo "::error::The tag says $tag but the files say $app. Fix the versions, then tag again."
              exit 1
            fi
          fi
          echo "version=$app" >> "$GITHUB_OUTPUT"

  # The one place that decides whether this run is a real release: a `v*` tag push whose commit is
  # part of main's history. Only then do the build jobs receive the update-signing key and does
  # the publish job run. A manual run, or a tag cut from any other branch, still builds (with a
  # throwaway signing key made on the runner) so the files can be checked, and publishes nothing.
  gate:
    name: Official release?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      official: ${{ steps.g.outputs.official }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: g
        shell: bash
        run: |
          set -euo pipefail
          official=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            git fetch --no-tags origin main
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              official=true
            else
              echo "::warning::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main's history: building with a throwaway key, publishing nothing."
            fi
          else
            echo "Not a tag push: building with a throwaway key, publishing nothing."
          fi
          echo "official=$official" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows
    needs: [versions, gate]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (the toolchain itself is pinned by the input below)
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install frontend dependencies
        run: npm ci

      # atlas-usage.exe, then the signed installer with it inside, then Atlas Setup with that
      # installer inside. tools/build-setup.ps1 is the same chain anyone runs locally.
      - name: Build installer and Atlas Setup
        shell: pwsh
        # No secret here. Tauri wants some key to build the update bundle; this one lives for
        # this run only. The `publish` job signs the real bundles.
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'throwaway-update.key'
          $pw = (New-Guid).ToString('N') + (New-Guid).ToString('N')
          npx tauri signer generate --ci -f -p $pw -w $key | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'could not make the throwaway key' }
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $pw
          $env:TAURI_SIGNING_PRIVATE_KEY = Get-Content $key -Raw
          Remove-Item $key, "$key.pub" -Force
          ./tools/build-setup.ps1 -OutDir out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect files
        shell: bash
        # Through the environment, never pasted into the script text.
        env:
          VERSION: ${{ needs.versions.outputs.version }}
        run: |
          set -euo pipefail
          v="$VERSION"
          nsis="target/release/bundle/nsis/Atlas_${v}_x64-setup.exe"
          for f in "$nsis" "$nsis.sig" out/Atlas-Setup-Windows-x64.exe target/release/atlas-usage.exe; do
            [ -f "$f" ] || { echo "::error::Missing $f. A release without it would break updates or downloads."; exit 1; }
          done
          cp "$nsis" "$nsis.sig" out/
          cp target/release/atlas-usage.exe out/atlas-usage-windows-x64.exe
          rm -f out/atlas-usage.exe
          ls -l out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: files-windows
          if-no-files-found: error
          path: out/*

  macos:
    name: macOS (universal)
    needs: [versions, gate]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (the toolchain itself is pinned by the input below)
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install frontend dependencies
        run: npm ci

      # The Claude Code connector (atlas-mcp) rides inside the app: tauri.macos-bundle.conf.json
      # bundles this universal binary as a resource (Contents/Resources/atlas-mcp).
      - name: Build atlas-mcp (universal)
        run: |
          cargo build -p atlas-mcp --release --target aarch64-apple-darwin --target x86_64-apple-darwin
          lipo -create -output target/atlas-mcp-universal target/aarch64-apple-darwin/release/atlas-mcp target/x86_64-apple-darwin/release/atlas-mcp

      - name: Build app, dmg and update bundle
        env:
          # GitHub sets CI=true, and Tauri then skips the Finder step that lays the icons out on
          # the dmg background (no .DS_Store). The runner allows Finder scripting, so keep it.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        # No secret here. A throwaway key for this run only; the `publish` job signs the real bundle.
        run: |
          key="$RUNNER_TEMP/throwaway-update.key"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$(openssl rand -hex 24)
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          npx tauri signer generate --ci -f -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" -w "$key" >/dev/null
          TAURI_SIGNING_PRIVATE_KEY=$(cat "$key")
          export TAURI_SIGNING_PRIVATE_KEY
          rm -f "$key" "$key.pub"
          npx tauri build --target universal-apple-darwin --config crates/app/tauri.macos-bundle.conf.json

      - name: Build atlas-usage
        run: |
          cargo build -p atlas-cli --release --target aarch64-apple-darwin --target x86_64-apple-darwin
          lipo -create -output atlas-usage-macos-universal target/aarch64-apple-darwin/release/atlas-usage target/x86_64-apple-darwin/release/atlas-usage

      - name: Collect files
        run: |
          set -euo pipefail
          b=target/universal-apple-darwin/release/bundle
          mkdir out
          dmg=$(ls "$b"/dmg/*.dmg | head -n 1)
          for f in "$dmg" "$b/macos/Atlas.app.tar.gz" "$b/macos/Atlas.app.tar.gz.sig" atlas-usage-macos-universal; do
            [ -f "$f" ] || { echo "::error::Missing $f. A release without it would break updates or downloads."; exit 1; }
          done
          cp "$dmg" out/Atlas-macOS.dmg
          cp "$b/macos/Atlas.app.tar.gz" "$b/macos/Atlas.app.tar.gz.sig" atlas-usage-macos-universal out/
          ls -l out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: files-macos
          if-no-files-found: error
          path: out/*

  linux-cli:
    name: atlas-usage (Linux)
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (the toolchain itself is pinned by the input below)
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo build -p atlas-cli --release

      - run: |
          mkdir out
          cp target/release/atlas-usage out/atlas-usage-linux-x64
          ls -l out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: files-linux
          if-no-files-found: error
          path: out/*

  linux-arm64:
    name: atlas-usage (Linux arm64)
    needs: versions
    # A native arm64 runner, so rusqlite's bundled C builds with the real toolchain and the
    # binary is run once below. No secret reaches this job.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (the toolchain itself is pinned by the input below)
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo build -p atlas-cli --release

      - name: Check it is an arm64 glibc binary that runs
        shell: bash
        run: |
          set -euo pipefail
          bin=target/release/atlas-usage
          file "$bin"
          file "$bin" | grep -q 'ARM aarch64' || { echo "::error::$bin is not an aarch64 ELF."; exit 1; }
          ldd "$bin"
          # The newest glibc symbol the binary asks for, so a too-new runner image shows up here.
          objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1
          # A real run on the fixture transcripts: indexes them into SQLite (the bundled C library).
          out="$("$bin" all --json --config-dir fixtures/claude-usage --cache-dir "$RUNNER_TEMP/atlas-cache")"
          echo "$out" | head -n 3
          echo "$out" | grep -q '"label": "All time"' || { echo "::error::$bin did not report usage."; exit 1; }

      - run: |
          mkdir out
          cp target/release/atlas-usage out/atlas-usage-linux-arm64
          ls -l out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: files-linux-arm64
          if-no-files-found: error
          path: out/*

  linux-musl:
    name: atlas-usage (Linux x64, static musl)
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (the toolchain itself is pinned by the input below)
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # rusqlite builds its own SQLite from C, so the build needs a musl C compiler (`musl-gcc`,
      # which is what the cc crate picks for this target).
      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - run: cargo build -p atlas-cli --release --target x86_64-unknown-linux-musl

      # The point of this file is Alpine and Docker images that have no glibc: prove it is static
      # and that it runs on Alpine itself (a real run on the fixture transcripts, which
      # indexes them into SQLite, the bundled C library).
      - name: Check it is static and runs on Alpine
        shell: bash
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/release/atlas-usage
          file "$bin"
          file "$bin" | grep -E -q 'statically linked|static-pie linked' || { echo "::error::$bin is not statically linked."; exit 1; }
          if readelf -d "$bin" | grep -q NEEDED; then
            readelf -d "$bin" | grep NEEDED
            echo "::error::$bin needs shared libraries."
            exit 1
          fi
          ldd "$bin" 2>&1 || true
          cache="$(mktemp -d)"
          out="$(docker run --rm -v "$PWD/$(dirname "$bin"):/b:ro" -v "$PWD/fixtures/claude-usage:/cfg:ro" -v "$cache:/cache" alpine:3.20 sh -c 'cat /etc/alpine-release >&2; /b/atlas-usage all --json --config-dir /cfg --cache-dir /cache')"
          echo "$out" | head -n 3
          echo "$out" | grep -q '"label": "All time"' || { echo "::error::$bin did not report usage on Alpine."; exit 1; }

      - run: |
          mkdir out
          cp target/x86_64-unknown-linux-musl/release/atlas-usage out/atlas-usage-linux-x64-musl
          ls -l out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: files-linux-musl
          if-no-files-found: error
          path: out/*

  windows-arm64:
    name: atlas-usage (Windows arm64)
    needs: versions
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (the toolchain itself is pinned by the input below)
        with:
          toolchain: 1.97.1
          targets: aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Cross-built on the x64 runner (it cannot run here), so check the PE header says arm64.
      - run: cargo build -p atlas-cli --release --target aarch64-pc-windows-msvc

      - name: Check it is an arm64 Windows binary
        shell: pwsh
        run: |
          $f = (Resolve-Path 'target/aarch64-pc-windows-msvc/release/atlas-usage.exe').Path
          $b = [IO.File]::ReadAllBytes($f)
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $sig = [Text.Encoding]::ASCII.GetString($b, $pe, 2)
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          '{0}: PE signature {1}, machine 0x{2:X4}' -f $f, $sig, $machine
          if ($sig -ne 'PE' -or $machine -ne 0xAA64) { throw ('{0} is not an arm64 PE (machine 0x{1:X4}, want 0xAA64).' -f $f, $machine) }

      - shell: bash
        run: |
          mkdir out
          cp target/aarch64-pc-windows-msvc/release/atlas-usage.exe out/atlas-usage-windows-arm64.exe
          ls -l out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: files-windows-arm64
          if-no-files-found: error
          path: out/*

  windows-arm64-smoke:
    name: atlas-usage (Windows arm64, run)
    needs: windows-arm64
    # A native Windows on Arm runner: the file the publish job releases (the artifact of
    # `windows-arm64`, not a rebuild) runs here once against the fixture transcripts.
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: fixtures/claude-usage

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: files-windows-arm64
          path: bin

      - name: Run it on the fixture transcripts
        shell: pwsh
        run: |
          'PROCESSOR_ARCHITECTURE = ' + $env:PROCESSOR_ARCHITECTURE
          $exe = (Resolve-Path 'bin/atlas-usage-windows-arm64.exe').Path
          $out = & $exe all --json --config-dir fixtures/claude-usage --cache-dir (Join-Path $env:RUNNER_TEMP 'atlas-cache') | Out-String
          if ($LASTEXITCODE -ne 0) { throw "atlas-usage exited with $LASTEXITCODE" }
          ($out -split "`n" | Select-Object -First 3) -join "`n"
          if ($out -notmatch '"label": "All time"') { throw 'atlas-usage did not report usage.' }

  publish:
    name: Publish
    needs: [versions, gate, windows, macos, linux-cli, linux-arm64, linux-musl, windows-arm64, windows-arm64-smoke]
    # Only a v* tag whose commit is on main's history (decided once, in the gate job).
    if: needs.gate.outputs.official == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only job that holds the real signing key. The key is a secret of the `release`
    # environment, which only accepts `v*` tags (docs/releasing.md has the commands that make it).
    environment: release
    # The only job that writes, and only to this repository: the staging prerelease and the pinned
    # skill checksums on main (the job token).
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Where the finished release is published later (tools/publish-public.ps1). Only used to
      # write the download URLs into latest.json.
      PUBLIC_REPO: dozeyy/atlas
      VERSION: ${{ needs.versions.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install the Tauri signer
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: files-*
          merge-multiple: true
          path: dist

      - name: Check every file is there
        shell: bash
        run: |
          set -euo pipefail
          expected="Atlas-Setup-Windows-x64.exe Atlas_${VERSION}_x64-setup.exe Atlas_${VERSION}_x64-setup.exe.sig
          Atlas-macOS.dmg Atlas.app.tar.gz Atlas.app.tar.gz.sig
          atlas-usage-windows-x64.exe atlas-usage-macos-universal atlas-usage-linux-x64
          atlas-usage-linux-arm64 atlas-usage-linux-x64-musl atlas-usage-windows-arm64.exe"
          for f in $expected; do
            [ -s "dist/$f" ] || { echo "::error::dist/$f is missing or empty."; exit 1; }
          done
          # Nothing else may be in dist either: SHA256SUMS.txt lists and the staged release uploads
          # whatever is there, so an extra file would be signed and staged unseen.
          extra="$(cd dist && ls -A | grep -v -x -F -f <(printf '%s\n' $expected) || true)"
          [ -z "$extra" ] || { echo "::error::unexpected files in dist (expected exactly 12): $extra"; exit 1; }
          ls -l dist

      # The build jobs signed with a key that no longer exists. These two files are what the in-app
      # updater checks against the public key in tauri.conf.json: sign them with the real one.
      - name: Sign the update bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::The release environment has no TAURI_SIGNING_PRIVATE_KEY secret."; exit 1; }
          for f in "dist/Atlas_${VERSION}_x64-setup.exe" dist/Atlas.app.tar.gz; do
            rm -f "$f.sig"
            # -p given explicitly: an empty password is a real value, not a missing one.
            npx tauri signer sign -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$f" >/dev/null
            [ -s "$f.sig" ] || { echo "::error::$f.sig was not written."; exit 1; }
          done
          ls -l dist

      # What the in-app updater reads: the version, the notes and, per platform, the signed bundle.
      - name: Write latest.json
        shell: bash
        run: |
          set -euo pipefail
          # The files are published at the public repo's release of the same tag (a later, manual step).
          base="https://github.com/${PUBLIC_REPO}/releases/download/${TAG}"
          # Notes belong to one version: docs/release-notes/<version>.md. A release without a file
          # of its own reads "Atlas <version>"; an older release's notes are never reused.
          notes="Atlas ${VERSION}"
          notes_file="docs/release-notes/${VERSION}.md"
          if [ -s "$notes_file" ]; then notes="$(cat "$notes_file")"; fi
          jq -n \
            --arg v "$VERSION" \
            --arg notes "$notes" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg win_url "$base/Atlas_${VERSION}_x64-setup.exe" \
            --arg win_sig "$(cat "dist/Atlas_${VERSION}_x64-setup.exe.sig")" \
            --arg mac_url "$base/Atlas.app.tar.gz" \
            --arg mac_sig "$(cat dist/Atlas.app.tar.gz.sig)" \
            '{
               version: $v, notes: $notes, pub_date: $date,
               platforms: {
                 "windows-x86_64":   { signature: $win_sig, url: $win_url },
                 "darwin-universal": { signature: $mac_sig, url: $mac_url },
                 "darwin-aarch64":   { signature: $mac_sig, url: $mac_url },
                 "darwin-x86_64":    { signature: $mac_sig, url: $mac_url }
               }
             }' > dist/latest.json
          jq . dist/latest.json

      # One list covering every asset in the Release, signed with the real update key. The
      # signature is what tools/publish-public.ps1 trusts for the installers and latest.json: a
      # file in the private repo's releases can be swapped by anything that can write there, but
      # not signed again without this key.
      - name: Write and sign SHA256SUMS.txt
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          sha256sum $(cd dist && ls | grep -v '^SHA256SUMS.txt' | sort | sed 's#^#dist/#') | sed 's#  dist/#  #' > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
          rm -f dist/SHA256SUMS.txt.sig
          npx tauri signer sign -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" dist/SHA256SUMS.txt >/dev/null
          [ -s dist/SHA256SUMS.txt.sig ] || { echo "::error::dist/SHA256SUMS.txt.sig was not written."; exit 1; }

      # The skill downloads atlas-usage and checks it against skill/skills/atlas/bin/checksums.txt;
      # pin the six binaries of THIS release there. This step writes to main, so it only does so
      # when that is safe, and otherwise fails (nothing is staged before this step succeeds):
      #  - the tag's commit must be part of main's history (a tag cut from a branch never pins);
      #  - the pin script runs as it is on main, not as the tag carries it;
      #  - main must still be on this version, and no newer version may be pinned already.
      # publish-public.ps1 reads the pins from main and refuses a version that is not pinned there.
      # Safe to rerun: a version already pinned with the same hashes changes nothing.
      - name: Pin skill checksums
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --unshallow origin
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG ($GITHUB_SHA) is not on main's history, so the skill checksums were not pinned and nothing was staged."
            exit 1
          fi
          # From here on every file is main's, the pin script included.
          git switch -C main origin/main
          plugin="$(jq -r .version skill/.claude-plugin/plugin.json)"
          if [ "$plugin" != "$VERSION" ]; then
            echo "::error::main is at plugin version $plugin, not $VERSION, so the skill checksums of $VERSION were not pinned and nothing was staged."
            exit 1
          fi
          sums=skill/skills/atlas/bin/checksums.txt
          pinned="$(awk '!/^[[:space:]]*#/ && NF >= 3 { print $1 }' "$sums" | sort -V | tail -n 1)"
          if [ -n "$pinned" ] && [ "$(printf '%s\n%s\n' "$pinned" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "::error::$pinned is already pinned, which is newer than $VERSION, so nothing was pinned and nothing was staged."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pin"
          cp dist/atlas-usage-windows-x64.exe dist/atlas-usage-macos-universal dist/atlas-usage-linux-x64 \
             dist/atlas-usage-linux-arm64 dist/atlas-usage-linux-x64-musl dist/atlas-usage-windows-arm64.exe "$RUNNER_TEMP/pin/"
          # Never -Force: a version that is pinned with other hashes stops here, loudly.
          pwsh tools/pin-skill-checksums.ps1 -Dir "$RUNNER_TEMP/pin" -Version "$VERSION"
          git add "$sums"
          if git diff --cached --quiet; then
            echo "checksums.txt already matches v${VERSION}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pin skill checksums for v${VERSION}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch --no-tags origin main
            git rebase origin/main
          done
          echo "::error::Could not push the pinned checksums to main."
          exit 1

      # The staging copy, in this private repo: a prerelease (never "latest"), so nothing public
      # points at it. Only here, after build, signing and pinning all succeeded. Idempotent: a rerun
      # replaces the files of an existing staging release. The notes are the ones already inside
      # latest.json, so the release page and the app's update tooltip say the same thing.
      # tools/publish-public.ps1 downloads it, verifies it and copies it to the public repo.
      - name: Create the staging release (private repo)
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          jq -r .notes dist/latest.json > "$notes"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --prerelease --title "Atlas ${VERSION} (staging)" --notes-file "$notes"
          else
            gh release create "$TAG" dist/* --verify-tag --prerelease --title "Atlas ${VERSION} (staging)" --notes-file "$notes"
          fi
