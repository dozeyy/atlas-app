<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Follows the Windows light/dark setting (tokens.css decides from prefers-color-scheme). -->
    <meta name="color-scheme" content="light dark" />
    <title>Atlas Setup</title>
    <!-- Transparent from the first byte: no white frame before the CSS arrives. -->
    <style>
      html,
      body {
        background: transparent;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="sheet" class="sheet" data-tauri-drag-region>
      <svg id="map" class="map" viewBox="0 0 560 380" aria-hidden="true">
        <defs>
          <path id="spark" />
          <path id="dot" />
          <linearGradient id="fade-t" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#000" stop-opacity="1" />
            <stop offset="0.3" stop-color="#000" stop-opacity="1" />
            <stop offset="1" stop-color="#000" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="fade-b" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#000" stop-opacity="1" />
            <stop offset="0.3" stop-color="#000" stop-opacity="1" />
            <stop offset="1" stop-color="#000" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="fade-l" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#000" stop-opacity="1" />
            <stop offset="0.3" stop-color="#000" stop-opacity="1" />
            <stop offset="1" stop-color="#000" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="fade-r" x1="1" y1="0" x2="0" y2="0">
            <stop offset="0" stop-color="#000" stop-opacity="1" />
            <stop offset="0.3" stop-color="#000" stop-opacity="1" />
            <stop offset="1" stop-color="#000" stop-opacity="0" />
          </linearGradient>
          <clipPath id="sheet-clip"><rect width="560" height="380" rx="18" /></clipPath>
          <!-- The lit part of the trail: shown only where this stroke has been drawn. -->
          <mask id="trail-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="560" height="380">
            <path id="trail-reveal" class="trail-reveal" />
          </mask>
          <!-- The unlit part: shown everywhere the lit part is NOT, so the two never double up. -->
          <mask id="base-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="560" height="380">
            <rect width="560" height="380" fill="#fff" />
            <path id="trail-reveal-b" class="trail-reveal trail-hide" />
          </mask>
          <!-- The contours stop short of the trail, the mark, the close button and the sheet's
               edge: white lets a line through, black is a clean gap. They run BEHIND the words
               and buttons (no gap for those); buttons keep their own solid fill. -->
          <mask id="ring-mask" maskUnits="userSpaceOnUse" x="-20" y="-20" width="600" height="420">
            <rect x="-20" y="-20" width="600" height="420" fill="#fff" />
            <!-- The sheet's own edge: lines die away before the border instead of running along it. -->
            <rect id="edge-t" x="0" y="0" width="560" height="40" fill="url(#fade-t)" />
            <rect id="edge-b" x="0" y="340" width="560" height="40" fill="url(#fade-b)" />
            <rect id="edge-l" x="0" y="0" width="40" height="380" fill="url(#fade-l)" />
            <rect id="edge-r" x="520" y="0" width="40" height="380" fill="url(#fade-r)" />
            <path id="hole-trail" class="hole hole-line" fill="none" />
            <g id="hole-mark" class="hole">
              <use href="#spark" id="hole-spark" />
              <use href="#dot" id="hole-dot" />
            </g>
            <circle id="hole-x" class="hole" />
            <circle id="hole-rays" class="hole" />
          </mask>
        </defs>
        <g clip-path="url(#sheet-clip)">
          <g id="rings" class="rings" mask="url(#ring-mask)"></g>
          <path id="trail-base" class="trail-base" mask="url(#base-mask)" />
          <path id="trail-done" class="trail-done" mask="url(#trail-mask)" />
          <circle id="walker" class="walker" r="5" />
        </g>
        <g id="mark-pos">
          <g id="mark">
            <use href="#spark" class="mark-ink" id="mark-spark" />
            <use href="#dot" class="mark-ink" id="mark-dot" />
          </g>
        </g>
        <g id="rays" class="rays"></g>
      </svg>

      <button id="x" class="x" type="button" aria-label="Close">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M3 3l10 10M13 3L3 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </button>

      <div id="copy" class="copy">
        <p id="line" class="line" aria-live="polite"></p>
        <div class="actions">
          <button id="primary" class="btn primary" type="button" hidden></button>
        </div>
        <!-- Installing only: on to start (the install takes seconds, so the default is the usual
             installer one); unticking takes the shortcut away again. The Start menu entry is always made. -->
        <div id="deskbox" class="databox" hidden>
          <label class="check"><input id="opt-desktop" type="checkbox" checked /><span class="box"></span>Put Atlas on the desktop</label>
        </div>
        <!-- Uninstalling only: the one choice, off unless the person ticks it. -->
        <div id="databox" class="databox" hidden>
          <label class="check"><input id="opt-data" type="checkbox" /><span class="box"></span>Also remove Atlas's saved data</label>
          <p class="hint">Your Claude Code chats are never touched.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/setup/main.ts"></script>
  </body>
</html>
