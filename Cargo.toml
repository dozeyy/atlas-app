[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/mcp", "crates/cli", "crates/setup"]
# Plain `cargo test` / `cargo build` covers the crates that need neither the
# front end nor WebView2. CI and `cargo test --workspace` include the Tauri app
# (its build needs `dist/`, so run `npm run build` first).
default-members = ["crates/core", "crates/mcp", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
dirs = "6"
tempfile = "3"
atlas-core = { path = "crates/core" }

# Debug builds still optimise the byte searcher every transcript read runs on. Unoptimised it ran
# about 100x slower than in release (44 vs 4,533 MB/s on a 400 KB tool-result line), which made a
# debug build's first receipt of a big chat crawl. Our own crates stay unoptimised for debugging.
[profile.dev.package.memchr]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
