<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atlas Setup (fun pass mockup)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="mock.css">
<script src="icons.js"></script>
<script src="mock.js"></script>
<style>
  .grid2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
  .path { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-code); font-size: 12px; color: var(--ink-2); }
  .path .ico { width: 14px; height: 14px; }
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 16px; }
  .tile { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .blob { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-tint); color: var(--accent-text);
    transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
  .blob .ico { width: 22px; height: 22px; }
  .tile:hover .blob, .tile.hover .blob { background: var(--accent); color: var(--on-accent); }
  .tile .num { font-size: 24px; line-height: 26px; font-weight: 800; }
  .checks { display: flex; flex-direction: column; gap: 7px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .tick { width: 18px; height: 18px; border-radius: 999px; background: var(--accent-solid); color: var(--on-accent); display: grid; place-items: center; }
  .tick .ico { width: 12px; height: 12px; }
  .search { flex: 1; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 10px; background: var(--surface);
    border: 1px solid var(--line-strong); color: var(--ink-2); }
  .search .ico { width: 16px; height: 16px; }
  .kbd { margin-left: auto; font-family: var(--font-code); font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line-strong); }
  .skills { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .skill { display: grid; grid-template-columns: 36px 1fr; gap: 12px; padding: 14px 16px; }
  .skill .blob { width: 36px; height: 36px; border-radius: 10px; }
  .skill .blob .ico { width: 20px; height: 20px; }
  .on-chip { height: 20px; padding: 0 8px; font-size: 11px; background: var(--success-tint); color: var(--success); }
  .sec { display: flex; align-items: baseline; gap: 10px; margin-top: 28px; }
  .pchip { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px 0 8px; border-radius: 999px; background: var(--raised);
    font-weight: 600; transition: transform var(--dur-hover) var(--ease-spring), background-color var(--dur-fast) var(--ease-out); }
  .pchip .ico { width: 15px; height: 15px; color: var(--ink-2); }
  .pchip b { font-weight: 780; color: var(--accent-text); }
  .pchip:hover, .pchip.hover { background: var(--accent-tint); transform: translateY(-1px); }
  .pchip:active { transform: scale(0.96); }
  .burst { position: absolute; inset: 0; pointer-events: none; }
  .burst i { position: absolute; left: 50%; top: 50%; width: 3px; height: 10px; margin: -5px 0 0 -1.5px; border-radius: 2px; background: var(--accent);
    rotate: calc(var(--k) * 45deg); translate: 0 0; opacity: 0; }
  html.intro .burst i { animation: ray 620ms var(--ease-expo) 900ms both; }
  @keyframes ray { 0% { opacity: 1; transform: rotate(0) translateY(-28px) scaleY(.4); } 60% { opacity: 1; } 100% { opacity: 0; transform: translateY(-58px) scaleY(1.2); } }
  html.intro .done-spark { animation: summit 520ms var(--ease-spring) 820ms both; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const types = [
  ["Skills", 24, "Lightning", "zap"], ["Agents", 9, "Robot", "tilt"], ["Commands", 6, "TerminalWindow", "nudge"],
  ["MCP servers", 5, "Plugs", "plug"], ["Hooks", 4, "Anchor", "swing"], ["Plugins", 2, "PuzzlePiece", "wiggle"],
  ["Instructions", 7, "BookOpen", "bob"], ["Rules", 3, "ListChecks", "pop"], ["Permissions", 58, "ShieldCheck", "pop"], ["Memory", 12, "Brain", "pop"],
];
const skills = [
  ["meal-planner", "Plans a week of dinners from what is already in the pantry and writes the shopping list."],
  ["photo-tidy", "Finds duplicate and blurry photos in a folder and suggests which ones to keep."],
  ["garden-journal", "Keeps the planting log: what went in, where, and when to water or harvest."],
  ["boat-checklist", "Walks through the pre-launch checklist and notes anything that needs a part ordered."],
];
const scope = [["Global", 58, "var(--chart-1)"], ["Projects", 64, "var(--chart-2)"], ["Plugins", 6, "var(--chart-3)"], ["claude.ai", 2, "var(--chart-4)"]];

document.getElementById("app").innerHTML = sidebar("setup") + `
<main class="main"><div class="page">
  <div class="head rise" style="--i:0">
    <div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="path">${icon("FolderSimple")}~/.claude</span>
        <span class="chip" style="height:20px;font-size:11px">${icon("Lock")}Read only</span>
        <span class="caption">Updated just now</span>
      </div>
      <div class="d d-title" style="margin-top:6px">Setup</div>
      <div class="muted" style="margin-top:6px;font-size:15px">Claude has 24 skills, 9 agents and 5 MCP servers to work with.</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" data-m="nudge" data-pin="btn-open">${icon("FolderSimple")}Open folder</button>
      <button class="btn btn-primary" data-m="spin" data-pin="btn-new">${icon("Plus")}New skill</button>
    </div>
  </div>

  <div class="grid2">
    <section class="card rise" style="--i:1">
      <div class="card-head"><div class="card-title">Where it all lives</div><span class="caption">Nothing here can break: this page only reads</span></div>
      <div style="display:flex;align-items:baseline;gap:8px;margin:12px 0 16px"><span class="d d-stat" data-to="130">130</span><span class="muted" style="font-weight:600">things set up across 6 projects</span></div>
      <div class="stack" id="stack">${scope.map(([n, v, c], i) => `<div class="seg-bar" data-pin="seg-${i}" style="--i:${i};flex:${v};background:${c}"></div>`).join("")}</div>
      <div style="display:flex;gap:20px;margin-top:14px">${scope.map(([n, v, c], i) => `<span style="display:flex;align-items:center;gap:6px"><span class="dot" style="background:${c}"></span><span class="muted">${n}</span><b class="d d-small">${v}</b></span>`).join("")}</div>
      <div class="caption" style="margin-top:22px">Projects with the most</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
        ${[["garden-planner", 22], ["recipe-box", 18], ["photo-sorter", 11], ["boat-log", 7]].map(([n, v], i) => `<button class="pchip" data-m="nudge" data-pin="pchip-${i}">${icon("FolderSimple")}${n}<b class="d">${v}</b></button>`).join("")}
        <button class="pchip muted">2 more</button>
      </div>
    </section>

    <section class="card rise" style="--i:2">
      <div class="card-head"><div class="card-title">Getting set up</div><span class="chip clay" style="height:20px;font-size:11px">4 of 4</span></div>
      <div style="display:flex;gap:16px;align-items:center;margin-top:12px">
        <div style="position:relative">
          <div id="ring"></div>
          <div class="burst">${[0, 1, 2, 3, 4, 5, 6, 7].map((k) => `<i style="--k:${k};rotate:${k * 45}deg"></i>`).join("")}</div>
        </div>
        <div>
          <div class="d d-small">All set.</div>
          <div class="caption" style="margin-top:2px">Claude has everything it needs.</div>
        </div>
      </div>
      <div class="checks" style="margin-top:12px">
        ${["Notes for Claude", "A skill", "An MCP server", "Your own permissions"].map((t) => `<div class="check"><span class="tick">${icon("Check")}</span>${t}</div>`).join("")}
      </div>
    </section>
  </div>

  <div class="tiles">
    ${types.map(([n, v, ic, m], i) => `<div class="card click swap tile rise" style="--i:${i + 3}" data-m="${m}" data-pin="tile-${i}">
      <span class="blob">${icon(ic)}</span><div><div class="d num" data-to="${v}">${v}</div><div class="caption">${n}</div></div></div>`).join("")}
  </div>

  <div style="display:flex;gap:12px;align-items:center;margin-top:24px">
    <div class="search">${icon("MagnifyingGlass")}Search your setup<span class="kbd">Ctrl F</span></div>
    <div class="seg"><div class="seg-thumb" style="width:44px;transform:translateX(0)"></div><button class="on" style="width:44px">All</button><button>Global</button><button>Projects</button></div>
  </div>

  <div class="sec"><span class="d d-figure">Skills</span><span class="caption">Know-how Claude picks up when it is relevant</span></div>
  <div class="skills">
    ${skills.map(([n, d], i) => `<div class="card click swap skill" data-m="zap" data-pin="skill-${i}">
      <span class="blob">${icon("Lightning")}</span>
      <div><div style="display:flex;justify-content:space-between;align-items:center"><b>${n}</b><span class="chip on-chip">On</span></div>
      <div class="muted" style="margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${d}</div></div>
    </div>`).join("")}
  </div>
</div></main>`;

ring(document.getElementById("ring"), 1, 72, 8, `<span class="spark done-spark" style="width:26px;height:26px"></span>`);
startCounts();
pinHovers();
if (window.PINS.some((p) => p.startsWith("seg-"))) document.getElementById("stack").classList.add("dim");
</script>
</body>
</html>
