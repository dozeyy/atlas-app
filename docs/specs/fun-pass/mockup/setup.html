<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atlas Setup (fun pass mockup)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="mock.css">
<script src="icons.js"></script>
<script src="mock.js"></script>
<style>
  /* Will's Setup layout (2026-11-08): checklist on top, equal type tiles that open each type,
     cards with an X (delete, with confirm). No summary card, no header chips. */
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 20px; }

  .setup-card { display: grid; grid-template-columns: 72px 1fr; gap: 20px; align-items: center; padding: 18px 20px; }
  .steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
  .step { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 8px 10px; border-radius: 10px; background: var(--raised); }
  .step.todo { background: transparent; border: 1px dashed var(--line-strong); }
  .step .label { font-size: 13px; font-weight: 600; line-height: 16px; }
  .step .sub { font-size: 12px; line-height: 16px; color: var(--ink-2); }
  .tick { flex: none; width: 20px; height: 20px; border-radius: 999px; background: var(--accent-solid); color: var(--on-accent); display: grid; place-items: center; }
  .tick .ico { width: 12px; height: 12px; }
  .todo .tick { background: transparent; border: 1.5px solid var(--line-strong); }
  .step .btn { margin-left: auto; height: 28px; padding: 0 10px; font-size: 12px; }

  .tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
  .tile { position: relative; display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; height: 72px; padding: 0 28px 0 16px; text-align: left; }
  .tile .num { font-size: 24px; line-height: 26px; }
  .tile .go { position: absolute; right: 10px; top: 50%; margin-top: -8px; width: 16px; height: 16px; color: var(--ink-2); opacity: 0; translate: -4px 0;
    transition: opacity var(--dur-fast) var(--ease-out), translate var(--dur-hover) var(--ease-spring); }
  .tile:hover .go, .tile.hover .go, .tile.open .go { opacity: 1; translate: 0 0; }
  .tile.open { border-color: var(--accent); background: color-mix(in srgb, var(--accent-tint) 60%, var(--surface)); }
  .tile.open .go { color: var(--accent-text); }
  .tile .go .w-reg { opacity: 1 !important; } .tile .go .w-duo, .tile .go .w-fill { opacity: 0 !important; }
  .blob { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-tint); color: var(--accent-text);
    transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
  .blob .ico { width: 22px; height: 22px; }
  .tile:hover .blob, .tile.hover .blob, .tile.open .blob { background: var(--accent); color: var(--on-accent); }

  .search { flex: 1; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 10px; background: var(--surface);
    border: 1px solid var(--line-strong); color: var(--ink-2); }
  .search .ico { width: 16px; height: 16px; }
  .kbd { margin-left: auto; font-family: var(--font-code); font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line-strong); }
  .sec { display: flex; align-items: baseline; gap: 10px; margin-top: 24px; }

  .items { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .item { position: relative; display: grid; grid-template-columns: 36px 1fr; gap: 12px; padding: 14px 44px 14px 16px; min-height: 84px; }
  .item .blob { width: 36px; height: 36px; border-radius: 10px; }
  .item .blob .ico { width: 20px; height: 20px; }
  .x { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-2);
    background: transparent; transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), rotate var(--dur-hover) var(--ease-spring); }
  .x .ico { width: 16px; height: 16px; }
  .x:hover, .x.hover { background: var(--danger-tint); color: var(--danger); rotate: 90deg; }
  .x:active { scale: 0.92; }
  .x:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Confirm replaces the card body in place: nothing is deleted on the first click. */
  .confirm { display: none; }
  .item.confirming { grid-template-columns: 1fr; padding-right: 16px; border-color: var(--danger); background: color-mix(in srgb, var(--danger-tint) 70%, var(--surface)); }
  .item.confirming > .blob, .item.confirming > .body, .item.confirming > .x { display: none; }
  .item.confirming .confirm { display: flex; align-items: center; gap: 12px; }
  .confirm .q { font-weight: 600; }
  .confirm .btns { margin-left: auto; display: flex; gap: 8px; }
  .btn-danger { background: var(--danger); color: var(--bg); }
  .btn-danger:hover, .btn-danger.hover { filter: brightness(1.08); transform: translateY(-1px); }

  .burst { position: absolute; inset: 0; pointer-events: none; }
  .burst i { position: absolute; left: 50%; top: 50%; width: 3px; height: 10px; margin: -5px 0 0 -1.5px; border-radius: 2px; background: var(--accent);
    rotate: calc(var(--k) * 45deg); opacity: 0; }
  html.intro .burst i { animation: ray 620ms var(--ease-expo) 900ms both; }
  @keyframes ray { 0% { opacity: 1; transform: rotate(0) translateY(-28px) scaleY(.4); } 60% { opacity: 1; } 100% { opacity: 0; transform: translateY(-58px) scaleY(1.2); } }
  html.intro .done-spark { animation: summit 520ms var(--ease-spring) 820ms backwards; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const params = new URLSearchParams(location.search);
const done = Math.min(4, Math.max(0, +(params.get("done") ?? 3)));
const types = [
  ["Skills", 24, "Lightning", "zap"], ["Agents", 9, "Robot", "tilt"], ["Commands", 6, "TerminalWindow", "nudge"],
  ["MCP servers", 5, "Plugs", "plug"], ["Hooks", 4, "Anchor", "swing"], ["Plugins", 2, "PuzzlePiece", "wiggle"],
  ["Instructions", 7, "BookOpen", "bob"], ["Rules", 3, "ListChecks", "pop"], ["Permissions", 58, "ShieldCheck", "pop"], ["Memory", 12, "Brain", "pop"],
];
const steps = [
  ["Notes for Claude", "CLAUDE.md is in place"], ["A skill", "24 skills found"],
  ["An MCP server", "5 connected"], ["Your permissions", done === 4 ? "58 rules set" : "Not set yet"],
];
const skills = [
  ["meal-planner", "Plans a week of dinners from what is already in the pantry and writes the shopping list."],
  ["photo-tidy", "Finds duplicate and blurry photos in a folder and suggests which ones to keep."],
  ["garden-journal", "Keeps the planting log: what went in, where, and when to water or harvest."],
  ["boat-checklist", "Walks through the pre-launch checklist and notes anything that needs a part ordered."],
];

const stepHtml = steps.map(([t, s], i) => i < done
  ? `<div class="step"><span class="tick">${icon("Check")}</span><div><div class="label">${t}</div><div class="sub">${s}</div></div></div>`
  : `<div class="step todo"><span class="tick"></span><div><div class="label">${t}</div><div class="sub">${s}</div></div><button class="btn btn-ghost" data-pin="btn-step">Set up</button></div>`).join("");

document.getElementById("app").innerHTML = sidebar("setup") + `
<main class="main"><div class="page">
  <div class="head rise" style="--i:0">
    <div>
      <div class="d d-title">Setup</div>
      <div class="muted" style="margin-top:6px;font-size:15px">Claude has 24 skills, 9 agents and 5 MCP servers to work with.</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" data-m="nudge" data-pin="btn-open" title="~/.claude">${icon("FolderSimple")}Open folder</button>
      <button class="btn btn-primary" data-m="spin" data-pin="btn-new">${icon("Plus")}New skill</button>
    </div>
  </div>

  <section class="card setup-card rise" style="--i:1">
    <div style="position:relative">
      <div id="ring"></div>
      ${done === 4 ? `<div class="burst">${[0, 1, 2, 3, 4, 5, 6, 7].map((k) => `<i style="--k:${k};rotate:${k * 45}deg"></i>`).join("")}</div>` : ""}
    </div>
    <div>
      <div class="card-head"><div class="card-title">${done === 4 ? "All set. Claude has everything it needs." : "Getting set up"}</div>
        <span class="chip clay" style="height:20px;font-size:11px">${done} of 4</span></div>
      <div class="steps">${stepHtml}</div>
    </div>
  </section>

  <div class="tiles">
    ${types.map(([n, v, ic, m], i) => `<button class="card click swap tile rise ${i === 0 ? "open" : ""}" style="--i:${i + 2}" data-m="${m}" data-pin="tile-${i}" aria-pressed="${i === 0}">
      <span class="blob">${icon(ic)}</span><div><div class="d d-stat num" data-to="${v}">${v}</div><div class="caption">${n}</div></div>${icon("CaretRight", "go")}</button>`).join("")}
  </div>

  <div class="sec"><span class="d d-figure">Skills</span><span class="caption">Know-how Claude picks up when it is relevant</span></div>
  <div style="display:flex;gap:12px;align-items:center;margin-top:12px">
    <div class="search">${icon("MagnifyingGlass")}Search skills<span class="kbd">Ctrl F</span></div>
    <div class="seg"><div class="seg-thumb" style="width:44px;transform:translateX(0)"></div><button class="on" style="width:44px">All</button><button>Global</button><button>Projects</button></div>
  </div>
  <div class="items">
    ${skills.map(([n, d], i) => `<div class="card click swap item" data-m="zap" data-pin="skill-${i}" id="item-${i}">
      <span class="blob">${icon("Lightning")}</span>
      <div class="body"><b>${n}</b>
      <div class="muted" style="margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${d}</div></div>
      <button class="x" data-pin="x-${i}" aria-label="Delete ${n}" title="Delete">${icon("X")}</button>
      <div class="confirm"><span class="q">Delete ${n}?</span><span class="caption">Claude stops using it.</span>
        <span class="btns"><button class="btn btn-ghost">Cancel</button><button class="btn btn-danger" data-pin="btn-del">Delete</button></span></div>
    </div>`).join("")}
  </div>
</div></main>`;

ring(document.getElementById("ring"), done / 4, 72, 8, done === 4
  ? `<span class="spark done-spark" style="width:26px;height:26px"></span>`
  : `<span class="d d-figure">${done}/4</span>`);
// Clicking X swaps the card into its confirm state; Cancel puts it back.
document.querySelectorAll(".item").forEach((it) => {
  it.querySelector(".x").addEventListener("click", (e) => { e.stopPropagation(); it.classList.add("confirming"); });
  it.querySelector(".confirm .btn-ghost").addEventListener("click", (e) => { e.stopPropagation(); it.classList.remove("confirming"); });
});
for (const p of window.PINS) if (p.startsWith("confirm-")) document.getElementById("item-" + p.slice(8))?.classList.add("confirming");
startCounts();
pinHovers();
</script>
</body>
</html>
