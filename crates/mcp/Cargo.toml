[package]
name = "atlas-mcp"
description = "Atlas MCP server: lets Claude Code read and (with backups) change the Claude setup over stdio. No network listener."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "atlas-mcp"
path = "src/main.rs"

[dependencies]
atlas-core.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "time"] }

[dev-dependencies]
tempfile.workspace = true
